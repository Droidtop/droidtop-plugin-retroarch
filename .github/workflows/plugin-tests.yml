name: Plugin tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/plugin-tests.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install kotlinc
        run: |
          curl -sfL https://github.com/JetBrains/kotlin/releases/download/v2.1.21/kotlin-compiler-2.1.21.zip -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Core ABI and ELF checks
        run: |
          # RetroArchState.kt reads JSON through org.json, which the JVM lacks: a copy is fetched to compile and run against.
          curl -sfL https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar -o "$RUNNER_TEMP/json.jar"
          kotlinc -cp "$RUNNER_TEMP/json.jar" src/dev/droidtop/plugins/retroarch/RetroArchState.kt test/CoresTest.kt -include-runtime -d "$RUNNER_TEMP/test.jar"
          java -cp "$RUNNER_TEMP/test.jar:$RUNNER_TEMP/json.jar" CoresTestKt
